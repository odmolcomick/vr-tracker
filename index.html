<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P VR Tracker</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #00ff9d; --bg: #050508; --panel: #11111a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        body { background: var(--bg); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        .screen { display: none; width: 100%; max-width: 600px; padding: 20px; text-align: center; animation: fadeIn 0.4s ease-out; }
        .active { display: block; }
        
        h1 { color: var(--primary); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 3px; font-size: 1.5rem; text-shadow: 0 0 10px rgba(0,255,157,0.3); }
        
        /* UI Elements */
        button {
            background: transparent; border: 2px solid var(--primary); color: var(--primary);
            padding: 16px 32px; font-size: 1.1rem; margin: 10px; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;
        }
        button:hover { background: var(--primary); color: var(--bg); box-shadow: 0 0 15px var(--primary); }
        button:active { transform: scale(0.96); }
        
        input {
            background: var(--panel); border: 2px solid #333; color: white;
            padding: 15px; font-size: 1.8rem; text-align: center; width: 220px;
            letter-spacing: 8px; text-transform: uppercase; margin-bottom: 20px; outline: none;
        }
        input:focus { border-color: var(--primary); }
        
        /* Tracker Specific */
        .code-display { 
            font-size: 3.5rem; color: var(--primary); border: 2px dashed var(--primary); 
            padding: 25px; margin: 20px auto; display: inline-block; 
            background: rgba(0,255,157,0.03); letter-spacing: 5px;
        }
        .status { margin-top: 15px; font-size: 0.85rem; opacity: 0.6; min-height: 20px; }
        
        /* --- VR VIEWER STYLES --- */
        .vr-wrapper {
            position: relative; width: 100vw; height: 100vh; 
            background: #000; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw;
            display: flex; overflow: hidden;
        }
        
        /* Each eye container */
        .eye-container {
            flex: 1; position: relative; overflow: hidden;
            /* Black separator between eyes */
            border-right: 4px solid #000; 
        }
        .eye-container:last-child { border-right: none; }

        /* The actual video element with distortion applied */
        .vr-video {
            width: 100%; height: 100%; object-fit: cover;
            /* Barrel Distortion for VR Lenses */
            filter: contrast(1.1) saturate(1.2);
            transform: scale(1.1); /* Slight zoom to hide distorted edges */
        }

        /* VR Overlay Grid & HUD */
        .vr-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background: 
                radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%), /* Vignette */
                linear-gradient(rgba(0,255,157,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,157,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
        }

        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border: 2px solid rgba(0,255,157,0.4); border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,255,157,0.2);
        }
        .crosshair::after {
            content:''; position:absolute; top:50%; left:50%; width:4px; height:4px; 
            background:var(--primary); transform:translate(-50%,-50%); border-radius:50%;
        }

        .live-indicator {
            position: absolute; top: 20px; left: 20px; 
            background: rgba(255,0,0,0.8); color: white; padding: 4px 10px; 
            font-size: 0.75rem; font-weight: bold; letter-spacing: 1px;
            border-radius: 2px; animation: pulse 2s infinite;
        }

        .fps-counter {
            position: absolute; bottom: 20px; right: 20px; 
            color: rgba(0,255,157,0.5); font-size: 0.7rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        
        .error-msg { color: #ff4444; margin-top: 10px; font-size: 0.85rem; min-height: 20px; }
        
        /* Mobile landscape warning */
        @media (orientation: portrait) {
            .vr-wrapper::after {
                content: "⚠️ ROTATE PHONE TO LANDSCAPE FOR VR";
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg);
                background: rgba(0,0,0,0.9); padding: 20px; border: 1px solid var(--primary);
                color: var(--primary); font-size: 1.2rem; z-index: 100; white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <!-- SELECTION -->
    <div id="screen-select" class="screen active">
        <h1>System Select</h1>
        <button onclick="initTracker()">📹 Tracker</button>
        <button onclick="showViewerInput()"> Viewer</button>
    </div>

    <!-- TRACKER -->
    <div id="screen-tracker" class="screen">
        <h1>Tracker Active</h1>
        <p style="opacity:0.7; font-size:0.9rem;">Share this code with viewer:</p>
        <div id="tracker-code" class="code-display">...</div>
        <div id="tracker-status" class="status">Initializing secure link...</div>
        <br><br>
        <button onclick="resetApp()" style="font-size:0.8rem; padding:10px 20px; border-color:#555; color:#888;">Exit</button>
    </div>

    <!-- VIEWER INPUT -->
    <div id="screen-viewer-input" class="screen">
        <h1>Enter Feed Code</h1>
        <input type="text" id="room-code" placeholder="XXXXXX" maxlength="6" autocomplete="off">
        <br>
        <button onclick="joinFeed()">Join Feed</button>
        <div id="viewer-error" class="error-msg"></div>
        <br><br>
        <button onclick="resetApp()" style="font-size:0.8rem; padding:10px 20px; border-color:#555; color:#888;">Back</button>
    </div>

    <!-- VR VIEWER FULLSCREEN -->
    <div id="screen-viewer-vr" class="screen" style="max-width:100%; padding:0;">
        <div class="vr-wrapper">
            <div class="eye-container">
                <video id="vr-left" class="vr-video" autoplay playsinline muted></video>
                <div class="vr-hud">
                    <div class="live-indicator">LIVE FEED</div>
                    <div class="crosshair"></div>
                    <div class="fps-counter" id="fps-left">-- FPS</div>
                </div>
            </div>
            <div class="eye-container">
                <video id="vr-right" class="vr-video" autoplay playsinline muted></video>
                <div class="vr-hud">
                    <div class="live-indicator">LIVE FEED</div>
                    <div class="crosshair"></div>
                    <div class="fps-counter" id="fps-right">-- FPS</div>
                </div>
            </div>
        </div>
        <!-- Hidden disconnect button area at bottom center -->
        <div style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:20;">
            <button onclick="resetApp()" style="background:rgba(0,0,0,0.7); border:1px solid #555; color:#aaa; padding:8px 20px; font-size:0.7rem;">DISCONNECT</button>
        </div>
    </div>

<script>
    const PEER_CONFIG = { debug: 0 };
    let peer = null;
    let localStream = null;
    let currentCall = null;
    let fpsInterval = null;

    // --- NAVIGATION ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        // Force fullscreen for VR mode
        if (id === 'screen-viewer-vr') {
            enterFullscreen();
            startFPSCounter();
        } else {
            exitFullscreen();
            stopFPSCounter();
        }
    }

    async function enterFullscreen() {
        const elem = document.documentElement;
        try {
            if (elem.requestFullscreen) await elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) await elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) await elem.msRequestFullscreen();
        } catch(e) { console.log("Fullscreen denied"); }
    }

    function exitFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(()=>{});
        }
    }

    function resetApp() {
        if (peer) { peer.destroy(); peer = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        if (currentCall) { currentCall.close(); currentCall = null; }
        
        ['local-video', 'vr-left', 'vr-right'].forEach(id => {
            const v = document.getElementById(id);
            if(v) v.srcObject = null;
        });
        
        document.getElementById('room-code').value = '';
        document.getElementById('viewer-error').textContent = '';
        exitFullscreen();
        showScreen('screen-select');
    }

    // --- TRACKER ---
    async function initTracker() {
        showScreen('screen-tracker');
        const statusEl = document.getElementById('tracker-status');
        const codeEl = document.getElementById('tracker-code');
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: {ideal: 1920}, height: {ideal: 1080} }, 
                audio: false 
            });
            
            const shortId = Math.random().toString(36).substring(2, 8).toUpperCase();
            codeEl.textContent = shortId;
            
            peer = new Peer(shortId, PEER_CONFIG);
            
            peer.on('open', () => {
                statusEl.textContent = `✅ Online. Waiting for viewer...`;
            });
            
            peer.on('call', (call) => {
                statusEl.textContent = "📡 Viewer connected! Broadcasting...";
                call.answer(localStream);
                currentCall = call;
                call.on('close', () => { statusEl.textContent = "❌ Viewer disconnected."; currentCall = null; });
            });
            
            peer.on('error', (err) => {
                if(err.type === 'unavailable-id') {
                    statusEl.textContent = "⚠️ Code taken. Retrying...";
                    setTimeout(initTracker, 800);
                } else {
                    statusEl.textContent = "Error: " + err.type;
                }
            });
            
        } catch (err) {
            statusEl.textContent = "❌ Camera Error: " + err.message;
            statusEl.style.color = "#ff4444";
        }
    }

    // --- VIEWER ---
    function showViewerInput() { showScreen('screen-viewer-input'); }

    async function joinFeed() {
        const code = document.getElementById('room-code').value.trim().toUpperCase();
        const errorEl = document.getElementById('viewer-error');
        const statusEl = document.createElement('div'); // Temporary status
        
        if (code.length < 4) { errorEl.textContent = "Invalid code"; return; }
        
        errorEl.textContent = "";
        showScreen('screen-viewer-vr');
        
        try {
            peer = new Peer(null, PEER_CONFIG);
            
            peer.on('open', () => {
                const call = peer.call(code, null);
                currentCall = call;
                
                call.on('stream', (remoteStream) => {
                    // Mirror to both eyes for stereoscopic VR
                    document.getElementById('vr-left').srcObject = remoteStream;
                    document.getElementById('vr-right').srcObject = remoteStream;
                });
                
                call.on('error', (err) => {
                    alert("Connection failed: " + err.type);
                    resetApp();
                });
                
                call.on('close', () => {
                    alert("Tracker disconnected");
                    resetApp();
                });
            });
            
            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    alert("Tracker not found. Check code.");
                    resetApp();
                }
            });
            
        } catch (err) {
            alert("Init Error: " + err.message);
            resetApp();
        }
    }

    // --- FPS COUNTER ---
    function startFPSCounter() {
        let lastTime = performance.now();
        let frames = 0;
        fpsInterval = setInterval(() => {
            const now = performance.now();
            const fps = Math.round((frames * 1000) / (now - lastTime));
            document.getElementById('fps-left').textContent = fps + " FPS";
            document.getElementById('fps-right').textContent = fps + " FPS";
            frames = 0;
            lastTime = now;
        }, 1000);
        
        // Count frames via requestAnimationFrame
        function countFrame() {
            frames++;
            if(fpsInterval) requestAnimationFrame(countFrame);
        }
        requestAnimationFrame(countFrame);
    }

    function stopFPSCounter() {
        if(fpsInterval) clearInterval(fpsInterval);
        fpsInterval = null;
    }
</script>
</body>
</html>

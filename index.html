<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P VR Tracker</title>
    <!-- PeerJS for WebRTC signaling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #00ff9d; --bg: #0a0a12; --panel: #161625; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        body { background: var(--bg); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }
        
        .screen { display: none; width: 100%; max-width: 800px; padding: 20px; text-align: center; animation: fadeIn 0.5s; }
        .active { display: block; }
        
        h1 { color: var(--primary); margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; font-size: 1.8rem; }
        
        /* Buttons & Inputs */
        button {
            background: transparent; border: 2px solid var(--primary); color: var(--primary);
            padding: 15px 30px; font-size: 1.2rem; margin: 10px; cursor: pointer;
            transition: 0.3s; text-transform: uppercase; font-weight: bold;
        }
        button:hover, button:active { background: var(--primary); color: var(--bg); }
        
        input {
            background: var(--panel); border: 1px solid #333; color: white;
            padding: 15px; font-size: 1.5rem; text-align: center; width: 200px;
            letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px;
        }
        
        /* Tracker UI */
        .code-display { 
            font-size: 3rem; color: var(--primary); border: 2px dashed var(--primary); 
            padding: 20px; margin: 20px auto; display: inline-block; background: rgba(0,255,157,0.05);
        }
        .status { margin-top: 15px; font-size: 0.9rem; opacity: 0.7; min-height: 20px;}
        
        /* VR Viewer UI */
        .vr-container {
            display: flex; gap: 10px; height: 60vh; width: 100%; 
            background: #000; border: 2px solid #333; position: relative;
        }
        .vr-eye {
            flex: 1; position: relative; overflow: hidden; border-radius: 50% / 10%;
            border: 1px solid #222;
        }
        .vr-eye video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* VR Overlay Grid */
        .vr-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none;
            background: linear-gradient(rgba(0,255,157,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,255,157,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .vr-crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; border: 2px solid rgba(0,255,157,0.5); border-radius: 50%;
        }
        .live-badge {
            position: absolute; top: 15px; left: 15px; background: red; color: white;
            padding: 2px 8px; font-size: 0.8rem; font-weight: bold; border-radius: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .error { color: #ff4444; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- SELECTION SCREEN -->
    <div id="screen-select" class="screen active">
        <h1>System Select</h1>
        <button onclick="initTracker()">📹 Tracker</button>
        <button onclick="showViewerInput()">🥽 Viewer</button>
    </div>

    <!-- TRACKER SCREEN -->
    <div id="screen-tracker" class="screen">
        <h1>Tracker Active</h1>
        <p>Share this code with the viewer:</p>
        <div id="tracker-code" class="code-display">...</div>
        <div id="tracker-status" class="status">Initializing secure link...</div>
        <video id="local-video" autoplay muted playsinline style="display:none;"></video>
        <br><br>
        <button onclick="resetApp()" style="font-size: 0.9rem; padding: 10px 20px;">Exit</button>
    </div>

    <!-- VIEWER INPUT SCREEN -->
    <div id="screen-viewer-input" class="screen">
        <h1>Enter Feed Code</h1>
        <input type="text" id="room-code" placeholder="XXXXXX" maxlength="6">
        <br>
        <button onclick="joinFeed()">Join Feed</button>
        <div id="viewer-error" class="error"></div>
        <br><br>
        <button onclick="resetApp()" style="font-size: 0.9rem; padding: 10px 20px;">Back</button>
    </div>

    <!-- VIEWER VR SCREEN -->
    <div id="screen-viewer-vr" class="screen">
        <h1>VR Live Feed</h1>
        <div class="vr-container">
            <div class="vr-eye"><video id="vr-left" autoplay playsinline></video></div>
            <div class="vr-eye"><video id="vr-right" autoplay playsinline></video></div>
            <div class="vr-overlay">
                <div class="live-badge">LIVE</div>
                <div class="vr-crosshair"></div>
            </div>
        </div>
        <div id="viewer-status" class="status">Connecting to tracker stream...</div>
        <br>
        <button onclick="resetApp()" style="font-size: 0.9rem; padding: 10px 20px;">Disconnect</button>
    </div>

<script>
    // --- CONFIGURATION ---
    // Using public PeerJS cloud server for signaling (free tier)
    const PEER_CONFIG = { debug: 2 }; 
    
    let peer = null;
    let localStream = null;
    let currentCall = null;

    // --- NAVIGATION ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function resetApp() {
        if (peer) { peer.destroy(); peer = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        if (currentCall) { currentCall.close(); currentCall = null; }
        
        // Clear videos
        ['local-video', 'vr-left', 'vr-right'].forEach(id => {
            const v = document.getElementById(id);
            v.srcObject = null;
        });
        
        document.getElementById('room-code').value = '';
        document.getElementById('viewer-error').textContent = '';
        showScreen('screen-select');
    }

    // --- TRACKER LOGIC ---
    async function initTracker() {
        showScreen('screen-tracker');
        const statusEl = document.getElementById('tracker-status');
        const codeEl = document.getElementById('tracker-code');
        
        try {
            // 1. Get Camera
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720} }, 
                audio: false 
            });
            
            // Show preview locally (optional, hidden by default but good for debugging)
            // document.getElementById('local-video').srcObject = localStream; 

            // 2. Generate Short ID
            const shortId = Math.random().toString(36).substring(2, 8).toUpperCase();
            codeEl.textContent = shortId;
            
            // 3. Initialize Peer
            peer = new Peer(shortId, PEER_CONFIG);
            
            peer.on('open', (id) => {
                statusEl.textContent = `✅ Online. Waiting for viewer to join ${id}...`;
            });
            
            peer.on('call', (call) => {
                statusEl.textContent = "📡 Viewer connected! Sending stream...";
                call.answer(localStream); // Answer with our camera stream
                currentCall = call;
                
                call.on('close', () => {
                    statusEl.textContent = "❌ Viewer disconnected.";
                    currentCall = null;
                });
            });
            
            peer.on('error', (err) => {
                console.error(err);
                if(err.type === 'unavailable-id') {
                    statusEl.textContent = "⚠️ Code taken. Refreshing...";
                    setTimeout(initTracker, 1000); // Retry with new code
                } else {
                    statusEl.textContent = "Error: " + err.type;
                }
            });
            
        } catch (err) {
            statusEl.textContent = "❌ Camera Error: " + err.message;
            statusEl.style.color = "#ff4444";
        }
    }

    // --- VIEWER LOGIC ---
    function showViewerInput() {
        showScreen('screen-viewer-input');
    }

    async function joinFeed() {
        const code = document.getElementById('room-code').value.trim().toUpperCase();
        const errorEl = document.getElementById('viewer-error');
        const statusEl = document.getElementById('viewer-status');
        
        if (code.length < 4) {
            errorEl.textContent = "Please enter a valid code";
            return;
        }
        
        errorEl.textContent = "";
        showScreen('screen-viewer-vr');
        statusEl.textContent = `🔗 Connecting to ${code}...`;
        
        try {
            peer = new Peer(null, PEER_CONFIG); // Let server assign us a random ID
            
            peer.on('open', () => {
                // Call the tracker
                const call = peer.call(code, localStream); // localStream is null here, which is fine for receive-only
                currentCall = call;
                
                call.on('stream', (remoteStream) => {
                    statusEl.textContent = "✅ Connected to Tracker";
                    // Mirror stream to both eyes for VR
                    document.getElementById('vr-left').srcObject = remoteStream;
                    document.getElementById('vr-right').srcObject = remoteStream;
                });
                
                call.on('error', (err) => {
                    statusEl.textContent = "❌ Connection failed: " + err.type;
                });
                
                call.on('close', () => {
                    statusEl.textContent = "❌ Tracker disconnected";
                });
            });
            
            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    statusEl.textContent = "❌ Tracker not found. Check code.";
                } else {
                    statusEl.textContent = "❌ Network Error: " + err.type;
                }
            });
            
        } catch (err) {
            statusEl.textContent = "❌ Init Error: " + err.message;
        }
    }
</script>
</body>
</html>
